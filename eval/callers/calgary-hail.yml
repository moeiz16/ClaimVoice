# Scripted test caller (format: docs/API_CONTRACT.md §5.6). Also drives the "calgary-hail" live demo line.
key: calgary-hail
title: Hail damage to a parked car, Calgary
language: en
region: CA-AB
caller_phone: "+14035550142"
policy_number: LM-AB-204118
turns:
  - text: "Hi, the hail this morning just smashed up my car."
  - text: "Yes, that's fine."
  - text: "Sure, it's LM-AB-204118."
  - text: "March third, 1986."
  - text: "It was parked on the street outside my house in Saddle Ridge, around seven this morning."
  - text: "The hood and roof are full of dents and the windshield has a crack across it."

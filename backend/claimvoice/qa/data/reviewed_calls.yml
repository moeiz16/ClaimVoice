      - [caller, 15, "Sure.", consent]
      - [person, 18, "I'm sorry about the window. Is everyone safe?", safety]
      - [caller, 22, "Yes, we're fine.", safety]
      - [person, 26, "When did it happen?", loss_details]
      - [caller, 29, "Around midnight.", loss_details]
      - [person, 33, "Was the roof, a window or a skylight damaged?", loss_details]
      - [caller, 37, "Just the garage window.", loss_details]
      - [person, 41, "Siding or a fence?", loss_details]
      - [caller, 44, "No.", loss_details]
      - [person, 47, "Is anything open to the weather?", loss_details]
      - [caller, 50, "I boarded it up.", loss_details]

# Calls handled by people (or by an older script) with known problems, reviewed by the quality lead. Used to test the
# call-quality scorer against human verdicts, and by the seed for the review queue. Times are seconds into the call.
# Turn: [speaker, seconds, text, stage]. Speakers: line, person, caller.
